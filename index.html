<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<link rel="icon" type="image/png" href="/custom40k-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS ignores the web manifest, so the home-screen icon and standalone mode come from these.
         status-bar-style "black" (NOT "black-translucent"): with viewport-fit=cover the top bar now
         pads itself by env(safe-area-inset-top) so its buttons never hide under the system status
         bar; "black-translucent" additionally tinted the bar and is not needed (Discord 2026-07-20,
         screenshot: the tab bar was drawn under the clock/signal icons and untappable). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Custom40k" />
    <meta name="theme-color" content="#18171a" />
    <title>Custom40k Army Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      WHITE-SCREEN SELF-HEAL. This runs before the bundle, on purpose.

      The service worker precaches a whole build. When several deploys land in a day, a device can
      be left holding an old build whose chunks the server no longer has — or whose cache iOS has
      partly evicted. The module then fails to load, nothing renders, and the user sees a blank
      page with no way out: reloading serves the same broken cache again.

      So: if the app has not mounted a few seconds in, or a chunk fails outright, throw away every
      service worker and cache and reload ONCE (the sessionStorage flag makes it once — a genuine
      app bug must never become a reload loop). Costs nothing when the app is healthy.
    -->
    <script>
      (function () {
        var KEY = 'c40k_sw_selfheal';
        function heal(why) {
          if (sessionStorage.getItem(KEY)) return;          // already tried this tab — don't loop
          sessionStorage.setItem(KEY, why || '1');
          var done = function () { location.reload(); };
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations()
              .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
              .catch(function () {}));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys()
              .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
              .catch(function () {}));
          }
          Promise.all(jobs).then(done, done);
        }
        // A chunk that never arrives (404 from a purged deploy, or an evicted cache entry).
        window.addEventListener('vite:preloadError', function () { heal('preload'); });
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) heal('asset');
        }, true);
        // Belt and braces: nothing rendered at all after 8s means the bundle never ran.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) heal('blank');
        }, 8000);
        // A clean boot clears the flag, so a future breakage may heal itself again.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount > 0) sessionStorage.removeItem(KEY);
          }, 3000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
